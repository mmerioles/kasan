services:
  kasan:
    build:
      context: .
      args:
        KASAN_UID: ${KASAN_UID:-1000}
        KASAN_GID: ${KASAN_GID:-1000}
    image: kasan
    container_name: kasan
    restart: unless-stopped
    ports:
      - "${KASAN_PORT:-7777}:7777"
    # Chromium otherwise gets Docker's tiny default /dev/shm and can crash on
    # image-heavy pages. This does not expose another host service.
    shm_size: "1gb"
    environment:
      KASAN_PASSCODE: ${KASAN_PASSCODE:?set KASAN_PASSCODE in .env}
      KASAN_WORKSPACE: /workspace
      KASAN_IDLE_MINUTES: ${KASAN_IDLE_MINUTES:-60}
      # Sign-in without a browser in the container. Run `claude setup-token` /
      # `codex login` on any machine that has one, then paste the result here.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # The repos you want the agent to work in.
      - ${HOST_WORKSPACE:-${HOME}/repos}:/workspace
      # The agent's whole home directory. It has to be the whole thing, not just
      # ~/.claude — Claude Code also keeps ~/.claude.json beside it, and a
      # container rebuild would otherwise throw that away along with your login.
      - kasan-home:/home/node
      # kasan's own session index.
      - kasan-data:/app/data
      # So the agent can commit as you.
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro

volumes:
  kasan-home:
  kasan-data:
