<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Kasan agent control room</title>
  <desc id="desc">A hand-drawn phone sends a note to kasan, which wakes Claude and Codex beside a repository.</desc>
  <defs>
    <filter id="wobble" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .ink{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .paper,.pink,.blue,.yellow{fill:#fff;stroke:#111;stroke-width:4;stroke-linejoin:round}
      text{font-family:"Comic Sans MS","Bradley Hand",cursive;fill:#111;text-anchor:middle}
    </style>
  </defs>
  <g filter="url(#wobble)">
    <path class="thin" d="M150 126 C210 92 230 98 287 119"/>
    <path class="thin" d="M474 118 C526 87 562 82 615 103"/>
    <path class="thin" d="M475 139 C532 166 561 172 618 151"/>
    <path class="ink" d="M274 114 l14 6 -13 8"/>
    <path class="ink" d="M604 96 l13 7 -13 8"/>
    <path class="ink" d="M605 144 l13 7 -14 7"/>

    <rect class="paper" x="42" y="62" width="104" height="150" rx="17"/>
    <path class="thin" d="M72 82 h44"/>
    <rect class="yellow" x="59" y="104" width="72" height="55" rx="8"/>
    <path class="thin" d="M73 121 h43 M73 134 h32 M73 147 h38"/>
    <circle cx="94" cy="188" r="7" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="94" y="239" font-size="20">you</text>

    <path class="pink" d="M292 67 Q375 48 466 68 L474 171 Q383 189 286 170 Z"/>
    <path class="thin" d="M309 89 q65 -13 142 1 M310 148 q64 13 144 -1"/>
    <circle cx="343" cy="119" r="6" fill="#111"/>
    <circle cx="414" cy="119" r="6" fill="#111"/>
    <path class="ink" d="M359 132 q20 16 40 0"/>
    <text x="380" y="218" font-size="25">kasan</text>

    <path class="blue" d="M624 48 l83 9 7 62 -88 5 z"/>
    <path class="thin" d="M640 72 h51 M641 87 h39"/>
    <text x="667" y="145" font-size="18">claude</text>

    <path class="yellow" d="M623 151 q43 -11 89 2 l-3 62 q-42 10 -85 -1 z"/>
    <path class="thin" d="M640 174 h54 M640 190 h36"/>
    <text x="667" y="239" font-size="18">codex</text>

    <path class="thin" d="M496 215 q42 15 83 -2"/>
    <path class="ink" d="M575 205 l10 8 -12 5"/>
    <path class="paper" d="M500 190 h59 l12 12 v38 h-71 z"/>
    <path class="thin" d="M559 190 v13 h12 M513 216 h42 M513 228 h30"/>
    <text x="535" y="258" font-size="16">repo</text>
  </g>
</svg>
